# Публикация сайта курса на GitHub Pages.
#
# Сайт лежит в подпапке site/, поэтому обычные настройки Pages
# («deploy from branch») не подходят — публикуем через Actions.
# Данные (site/data-*.js) пересобираются из Markdown перед публикацией,
# чтобы на сайте всегда был актуальный курс.
#
# Как включить: Settings → Pages → Source: GitHub Actions.

name: pages

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - 'ru/**'
      - 'tg/**'
      - 'checks/**'
      - 'videos/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Один деплой за раз; новый push отменяет только ожидающие, но не текущий.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Пересобрать данные сайта
        run: python site/build-data.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
